name: Build dandelion kernel + KernelSU Next

on:
  workflow_dispatch:

env:
  DEFCONFIG: dandelion_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source (dandelion-q-oss)
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: dandelion-q-oss
          fetch-depth: 1

      - name: Install toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libncurses-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            device-tree-compiler cpio lz4 rsync python2 python-is-python2

      - name: Integrate KernelSU Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Generate base config
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          mkdir -p out
          make O=out ${DEFCONFIG}

      - name: Enable KernelSU-required options
        run: |
          ./scripts/config --file out/.config \
            --enable KSU \
            --enable KPROBES \
            --enable HAVE_KPROBES \
            --enable KPROBE_EVENTS \
            --enable OVERLAY_FS
          make O=out olddefconfig

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make O=out -j$(nproc) 2>&1 | tee build.log

      - name: Upload build log (siempre, sirve para depurar errores)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: dandelion-kernel-ksu-next
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/.config
          if-no-files-found: warn
